name: Fetch monthly data

on:
  schedule:
    # Slow-moving open data: police crime CSVs (yearly, ~June), GTFS bus feeds
    # (a few revisions per year), shelter/AED designations (rare), and the
    # household waste calendar (reissued every April, with new attachment IDs).
    - cron: '23 3 5 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch the deploy workflow after committing new data

concurrency:
  group: fetch-monthly
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # fetch-bus-data.mjs needs fflate to read the GTFS zip
      - run: npm ci

      # fetch-garbage-data.mjs reads the 41 district calendars with pdftotext.
      # It is present on the GitHub-hosted Ubuntu images, but installed
      # explicitly so a change to the image cannot silently break the parse.
      - name: Install poppler-utils
        run: sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Fetch crime, bus, shelter and waste data
        run: |
          node scripts/fetch-crime-data.mjs
          node scripts/fetch-bus-data.mjs
          node scripts/fetch-shelter-data.mjs
          node scripts/fetch-garbage-data.mjs

      # The item-by-item waste dictionary — gated until 環境業務課 confirms it falls
      # under the open-data listing that already covers the calendar.
      - name: Fetch waste dictionary
        run: |
          if grep -q 'garbageDictionary: true' src/features.ts; then
            node scripts/fetch-garbage-dictionary.mjs
          else
            echo "garbageDictionary is off — skipping."
          fi

      # Yearly fire statistics — gated like the 30-minute fire fetch.
      - name: Fetch fire statistics
        run: |
          if grep -q 'fireLiveData: true' src/features.ts; then
            node scripts/fetch-fire-stats.mjs
          else
            echo "fireLiveData is off — skipping."
          fi

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- public/data/; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "data: refresh monthly open data (crime, bus, shelters, waste)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger `on: push` workflows
      # (anti-recursion rule), so kick the deploy explicitly.
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
